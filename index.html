<section class="step" id="how"><div class="card"><h2>How this graph works ${anchor("how")}</h2>
<p><b>The axis</b> is training compute in FLOP, the number of calculations used to train a model. It is logarithmic, so each step up multiplies. Steady exponential growth would be a straight line here. Since 1987 the record has grown about 2.6× a year on average, with a plateau from 2007 to 2013. That is close to steady exponential growth.</p>
<p><b>The line</b> is the largest training run so far. It moves in steps because it only changes when a bigger model appears. Early years have few models, so its shape before 1987, including the flat stretch from 1960, is rough.</p>
<p><b>White dots</b> are ${E.length} milestones we picked. Each sits on the line at its date. Those before 1950 sit on the floor because the data starts there, so that flat stretch is not a measurement.</p>
<p><b>The AI, AGI and ASI lines</b> mark the loudest public moment for each claim: ChatGPT, GPT-6 Astra and the Riemann proof. The choices are ours. AGI and ASI are disputed, so the lines track what people said, not what was reached. In the widest views, one band covers all three.</p>
<p><b>Faint dots</b> are 546 AI models with a date and a compute estimate, from ${ex('Epoch AI','https://epoch.ai/data/ai-models')} (${ex('CC BY','https://creativecommons.org/licenses/by/4.0/')}, downloaded 23 Nov 2026). Some estimates are speculative; hover over a dot for its rating.</p></div></section>`;
